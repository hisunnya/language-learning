<!DOCTYPE html>
<html lang="zh-CN" data-theme="indigo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日话题 · 分龄讨论</title>
  <meta name="theme-color" content="#8B5A3C">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=20261104-header">
  <link rel="stylesheet" href="/shared/module-header.css?v=20261104-compact2">
</head>
<body>
  <div class="app">
    <header class="portal-topbar">
      <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
        <span class="portal-brand-mark" aria-hidden="true">谈</span>
          <span class="portal-brand-copy"><strong><span data-module-zh="每日话题" data-module-en="Daily Topics">每日话题</span></strong><small data-module-zh="初中、高中与大学话题" data-module-en="Topics across ages">初中、高中与大学话题</small></span>
      </a>
      <div class="portal-topbar-right">
        <div class="portal-header-controls" id="portalHeaderControls"></div>
        <div class="points-card" id="pointsCard" title="点击查看积分说明">
          <div class="points-icon">★</div>
          <div class="points-info">
            <div class="points-label">积分</div>
            <div class="points-value" id="pointsValue">0</div>
          </div>
        </div>
      </div>
    </header>

    <div class="audience-tabs" id="audienceTabs" role="group" aria-label="话题集">
      <button type="button" class="audience-btn active" data-audience="middle" aria-pressed="true">初中生</button>
      <button type="button" class="audience-btn" data-audience="high" aria-pressed="false">高中生</button>
      <button type="button" class="audience-btn" data-audience="university" aria-pressed="false">大学生</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-view="home">抽话题</button>
      <button class="tab" data-view="history">历史记录</button>
    </nav>

    <!-- =================== 主页 =================== -->
    <section class="view active" id="viewHome">
      <div class="section-label">选择分类</div>
      <div class="category-chips" id="categoryChips"></div>

      <div class="section-label">今天的话题</div>

      <!-- 空状态 -->
      <div id="topicEmpty" class="topic-card">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div class="empty-state-text">
            点下面的按钮开始今天的讨论<br>
            也可以先选一个感兴趣的分类
          </div>
        </div>
      </div>

      <!-- 结果展示 -->
      <div id="topicResult" class="topic-card" style="display:none;">
        <span class="topic-category" id="topicCategory"></span>
        <div class="topic-text" id="topicText"></div>
        <div class="topic-hint" id="topicHint">
          <div class="topic-hint-title">参考方向</div>
          <ul class="topic-hint-list" id="topicHintList"></ul>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-primary" id="btnDraw">🎲 抽一个</button>
        <button class="btn btn-accent" id="btnViewHint">查看方向 (-2积分)</button>
        <button class="btn btn-ghost" id="btnSkip">换一个</button>
        <button class="btn btn-success" id="btnEnd">✓ 结束讨论</button>
      </div>
    </section>

    <!-- =================== 历史 =================== -->
    <section class="view" id="viewHistory">
      <div class="history-stats">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">总讨论次数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statRemaining">0</div>
          <div class="stat-label">剩余话题</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTotalPoints">0</div>
          <div class="stat-label">累计积分</div>
        </div>
      </div>

      <div class="section-label">讨论记录</div>
      <div id="historyEmpty" class="empty-state" style="display:none;">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-text">还没有讨论记录，<br>去抽一个话题开始吧</div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <!-- 积分 modal -->
  <div class="modal-mask" id="pointsModal" data-close>
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="pointsModalTitle">积分说明</div>
      <div class="modal-body" id="pointsModalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" data-close>知道了</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/shared/module-header.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
