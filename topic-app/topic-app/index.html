<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日话题 · 亲子讨论</title>
  <meta name="theme-color" content="#8B5A3C">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=20261104-header">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">谈</div>
        <div>
          <h1>每日话题</h1>
          <p>Daily Topics · 与孩子的一次深度对话</p>
        </div>
      </div>
      <div class="header-right">
        <!-- 主题切换 -->
        <div class="theme-switcher">
          <button class="theme-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3a9 9 0 0 0 0 18 4.5 4.5 0 0 1 0-9 4.5 4.5 0 0 0 0-9z" fill="currentColor"></path>
            </svg>
          </button>
          <div class="theme-picker" id="themePicker">
            <button class="theme-option" data-theme="warm">
              <div class="theme-swatch">
                <span style="background:#8B5A3C"></span>
                <span style="background:#D4A574"></span>
                <span style="background:#FAF6F0"></span>
              </div>
              <span>暖棕</span>
            </button>
            <button class="theme-option" data-theme="forest">
              <div class="theme-swatch">
                <span style="background:#4A6B4A"></span>
                <span style="background:#8FA68A"></span>
                <span style="background:#F4F7F2"></span>
              </div>
              <span>森绿</span>
            </button>
            <button class="theme-option" data-theme="mist">
              <div class="theme-swatch">
                <span style="background:#4A5C7A"></span>
                <span style="background:#8FA0BD"></span>
                <span style="background:#F2F4F8"></span>
              </div>
              <span>雾蓝</span>
            </button>
          </div>
        </div>

        <!-- 积分卡 -->
        <div class="points-card" id="pointsCard" title="点击查看积分说明">
          <div class="points-icon">★</div>
          <div class="points-info">
            <div class="points-label">积分</div>
            <div class="points-value" id="pointsValue">0</div>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="home">抽话题</button>
      <button class="tab" data-view="history">历史记录</button>
    </nav>

    <!-- =================== 主页 =================== -->
    <section class="view active" id="viewHome">
      <div class="section-label">选择分类</div>
      <div class="category-chips" id="categoryChips"></div>

      <div class="section-label">今天的话题</div>

      <!-- 空状态 -->
      <div id="topicEmpty" class="topic-card">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div class="empty-state-text">
            点下面的按钮开始今天的讨论<br>
            也可以先选一个感兴趣的分类
          </div>
        </div>
      </div>

      <!-- 结果展示 -->
      <div id="topicResult" class="topic-card" style="display:none;">
        <span class="topic-category" id="topicCategory"></span>
        <div class="topic-text" id="topicText"></div>
        <div class="topic-hint" id="topicHint">
          <div class="topic-hint-title">参考方向</div>
          <ul class="topic-hint-list" id="topicHintList"></ul>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-primary" id="btnDraw">🎲 抽一个</button>
        <button class="btn btn-accent" id="btnViewHint">查看方向 (-2积分)</button>
        <button class="btn btn-ghost" id="btnSkip">换一个</button>
        <button class="btn btn-success" id="btnEnd">✓ 结束讨论</button>
      </div>
    </section>

    <!-- =================== 历史 =================== -->
    <section class="view" id="viewHistory">
      <div class="history-stats">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">总讨论次数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statRemaining">0</div>
          <div class="stat-label">剩余话题</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTotalPoints">0</div>
          <div class="stat-label">累计积分</div>
        </div>
      </div>

      <div class="section-label">讨论记录</div>
      <div id="historyEmpty" class="empty-state" style="display:none;">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-text">还没有讨论记录，<br>去抽一个话题开始吧</div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <!-- 积分 modal -->
  <div class="modal-mask" id="pointsModal" data-close>
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="pointsModalTitle">积分说明</div>
      <div class="modal-body" id="pointsModalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" data-close>知道了</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
