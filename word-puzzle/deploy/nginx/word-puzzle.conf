# 词境 Lexica —— nginx 站点配置
#
# 安装：
#   sudo install -d /etc/nginx/conf.d
#   sudo cp deploy/nginx/word-puzzle.conf /etc/nginx/conf.d/word-puzzle.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：站点名、服务名、目录名都沿用旧的 word-puzzle（改名会打断已部署的路径），
# 但产品名是「词境 Lexica」。hub 默认通过单独端口访问词境，避免根路径冲突。
#
# 约定：
#   * 静态文件（首页 / 题库工作台 / 成绩记录 / js / css）由 nginx 直接托管
#   * /api/ 反代给后端 Python 服务（默认 127.0.0.1:8765）
#   * 离线测试页由后端生成在 var/offline/，通过 /api/offline/ 下载

upstream word_puzzle_api {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name word-puzzle.example.com;   # ← 改成自己的域名或 IP

    # 上传词表需要较大的请求体
    client_max_body_size 32m;

    root /srv/word-puzzle/web;
    index index.html;

    access_log /var/log/nginx/word-puzzle.access.log;
    error_log  /var/log/nginx/word-puzzle.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # ---- 静态资源 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ---- API 反代 ----
    location ^~ /api/ {
        proxy_pass http://word_puzzle_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 离线测试页（后端生成的文件）----
    location /offline/ {
        alias /srv/word-puzzle/var/offline/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # ---- 备份/数据库文件不许从公网下载 ----
    location ~* \.(db|db-wal|db-shm|sqlite3?)$ {
        deny all;
        return 404;
    }
}
