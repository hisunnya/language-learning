# 词境 家庭版 / 班级版：只监听本机，由 Tailscale Funnel（或别的反向代理）转进来。
#
#   公网 --HTTPS--> Funnel --HTTP--> 127.0.0.1:@NGINX_PORT@ (本文件) --> 127.0.0.1:@PORT@ (后端)
#
# 为什么不直接让 Funnel 指向后端：nginx 在中间可以统一覆盖 Host / X-Forwarded-Host、
# 限制请求体大小、挡掉扫描器爱探的隐藏文件。

# 登录接口的全站速率上限。Funnel 后面看到的客户端 IP 都是 127.0.0.1，
# 按 IP 限速没有意义，所以用固定 key 做全站总量限制；单账号锁定在后端做。
limit_req_zone $server_name zone=wp_family_login:1m rate=30r/m;

server {
    listen 127.0.0.1:@NGINX_PORT@;
    server_name _;

    charset utf-8;
    # 默认只允许小请求体：未登录的人不能靠大请求体占用磁盘和带宽。
    client_max_body_size 2m;

    access_log /var/log/nginx/word-puzzle-family.access.log;
    error_log  /var/log/nginx/word-puzzle-family.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # 扫描器最爱探的东西：.env、.git、备份、隐藏文件、各种 AI 工具的配置文件。
    # （只管根路径下的请求；/word-puzzle/ 和 /shared/ 里只有代码仓库里的网页文件，安装脚本不会拷隐藏文件进去）
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env)$ { return 404; }
    location ~* ^/(AGENTS|CLAUDE|README)\.md$ { return 404; }

    location = / { return 302 /word-puzzle/; }

    location ^~ /shared/ {
        alias @INSTALL_DIR@/shared/;
        add_header Cache-Control "no-cache";
    }

    location = /word-puzzle { return 301 /word-puzzle/; }

    # 登录接口：全站限速
    location = /word-puzzle/api/auth/login {
        limit_req zone=wp_family_login burst=20 nodelay;
        limit_req_status 429;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/auth/login;
    }

    # 只有管理员会上传资料 / 名单；这两个接口放宽请求体上限
    # （写成精确匹配：有 ^~ 前缀的 location 会让正则 location 失效）
    location = /word-puzzle/api/materials {
        client_max_body_size 32m;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/materials;
    }

    location = /word-puzzle/api/admin/import {
        client_max_body_size 32m;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/admin/import;
    }

    location ^~ /word-puzzle/api/ {
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/;
    }

    # 页面和脚本：每次向服务器确认是否有更新（有 ETag，没改返回 304）
    location ^~ /word-puzzle/ {
        alias @INSTALL_DIR@/web/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
