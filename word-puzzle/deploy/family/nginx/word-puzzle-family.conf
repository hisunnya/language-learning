# 词境整站：主页、不用登录的模块，以及要登录的词境学生版（/word-puzzle/）。只监听本机，由 Tailscale Funnel（或别的反向代理）转进来。
#
#   公网 --HTTPS--> Funnel --HTTP--> 127.0.0.1:@NGINX_PORT@ (本文件) --> 127.0.0.1:@PORT@ (后端)
#
# 为什么不直接让 Funnel 指向后端：nginx 在中间可以统一覆盖 Host / X-Forwarded-Host、
# 限制请求体大小、挡掉扫描器爱探的隐藏文件。

# 缓存：页面本身（没有 ?v=）每次向服务器确认；样式、脚本这类带版本号 ?v=… 的文件让浏览器留一个小时。
# 外网这条路（Funnel）一来一回就要几百毫秒，一个页面有十几个文件，每个都问一遍「有没有更新」就是十几趟；
# 文件内容改了就要同时改页面里引用它的 ?v=（部署前检查），最迟一小时后所有人都会拿到新的。
map $arg_v $wp_family_static_cache {
    default "no-cache";
    "~."    "public, max-age=3600";
}

# 登录接口的全站速率上限：用固定 key 做全站总量限制（Funnel 虽然会通过 X-Forwarded-For 传访客 IP，
# 这里的 $remote_addr 仍然是 127.0.0.1）；单账号锁定在后端做。一个班四五十人同时登录不能被挡：每分钟 120 次、突发 60。
limit_req_zone $server_name zone=wp_family_login:1m rate=120r/m;
# 公开版 /words/ 的接口：谁都能调，给一个全站总量上限（单个地址的上限在后端：交成绩、要读音各自限速）。
limit_req_zone $server_name zone=wp_public_api:1m rate=40r/s;

server {
    listen 127.0.0.1:@NGINX_PORT@;
    server_name _;

    charset utf-8;

    # 重定向只返回相对路径（Location: /word-puzzle/）。nginx 默认会拼成绝对地址，
    # 而它只知道自己监听的 http://主机:8081，不知道前面还有 Funnel 的 https 和 443，
    # 结果学生被带到 https://…ts.net:8081/ 打不开。相对路径由浏览器按当前地址补全。
    absolute_redirect off;
    # 默认只允许小请求体：未登录的人不能靠大请求体占用磁盘和带宽。
    client_max_body_size 2m;

    access_log /var/log/nginx/word-puzzle-family.access.log;
    error_log  /var/log/nginx/word-puzzle-family.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # 扫描器最爱探的东西：.env、.git、备份、隐藏文件、各种 AI 工具的配置文件。
    # （只管根路径下的请求；/word-puzzle/ 和 /shared/ 里只有代码仓库里的网页文件，安装脚本不会拷隐藏文件进去）
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env)$ { return 404; }
    location ~* ^/(AGENTS|CLAUDE|README)\.md$ { return 404; }

    # ---------- 主页（原「语林」，现在叫词境）和不用登录的模块：纯静态 ----------
    # 主页文件在 @INSTALL_DIR@/site/hub（index.html、privacy.html、css/、js/），其余路径一律 404。
    root @INSTALL_DIR@/site/hub;
    index index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location = /privacy.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location ^~ /css/ {
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location ^~ /js/ {
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /topics { return 301 /topics/; }
    location ^~ /topics/ {
        alias @INSTALL_DIR@/site/topics/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }
    location = /ham { return 301 /ham/; }
    location ^~ /ham/ {
        alias @INSTALL_DIR@/site/ham/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }
    location = /chemistry { return 301 /chemistry/; }
    location ^~ /chemistry/ {
        alias @INSTALL_DIR@/site/chemistry/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }
    location = /physics { return 301 /physics/; }
    location ^~ /physics/ {
        alias @INSTALL_DIR@/site/physics/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }

    location ^~ /shared/ {
        alias @INSTALL_DIR@/shared/;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }

    # ---------- 词境公开版 /words/：不用登录，只有内置的初中、高中词汇，不能下载离线页 ----------
    # 页面是安装时从 web/ 生成的（tools/build_public_web.py）；接口转给同一个后端的 /pub/api/，后端只开放白名单。
    location = /words { return 301 /words/; }
    location ^~ /words/api/ {
        limit_req zone=wp_public_api burst=120 nodelay;
        limit_req_status 429;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/pub/api/;
    }
    location ^~ /words/ {
        alias @INSTALL_DIR@/web-public/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }

    location = /word-puzzle { return 301 /word-puzzle/; }

    # 登录接口：全站限速
    location = /word-puzzle/api/auth/login {
        limit_req zone=wp_family_login burst=60 nodelay;
        limit_req_status 429;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/auth/login;
    }

    # 只有管理员会上传资料 / 名单；这两个接口放宽请求体上限
    # （写成精确匹配：有 ^~ 前缀的 location 会让正则 location 失效）
    location = /word-puzzle/api/materials {
        client_max_body_size 32m;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/materials;
    }

    # 排排坐的朗读录音（最长 30 秒；苹果手机录的 AAC 比安卓的大一些）
    location = /word-puzzle/api/recordings {
        client_max_body_size 5m;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/recordings;
    }

    location = /word-puzzle/api/admin/import {
        client_max_body_size 32m;
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/admin/import;
    }

    location ^~ /word-puzzle/api/ {
        include @PROXY_INC@;
        proxy_pass http://127.0.0.1:@PORT@/api/;
    }

    # 页面和脚本：每次向服务器确认是否有更新（有 ETag，没改返回 304）
    location ^~ /word-puzzle/ {
        alias @INSTALL_DIR@/web/;
        index index.html;
        add_header Cache-Control $wp_family_static_cache;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # 静态目录里也挡住隐藏文件、数据库和备份文件（外层的正则 location 被 ^~ 前缀盖住，管不到这里）
        location ~ /\. { return 404; }
        location ~* \.(db|db-wal|db-shm|sqlite3?|bak|old|orig|swp|env|py|sh)$ { return 404; }
    }
}
