<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wp-base" content="/word-puzzle">
<title>词境 Lexica · 首页</title>
<link rel="stylesheet" href="/word-puzzle/css/app.css?v=20261104-theme">
<link rel="stylesheet" href="/shared/module-header.css">
</head>
<body>
<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
      <span class="portal-brand-mark" aria-hidden="true">词</span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="English vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav">
      <a href="/word-puzzle/" class="active" data-module-zh="首页" data-module-en="Home">首页</a>
      <a href="/word-puzzle/bank.html" data-module-zh="题库工作台" data-module-en="Banks">题库工作台</a>
      <a href="/word-puzzle/stats.html" data-module-zh="成绩记录" data-module-en="Scores">成绩记录</a>
    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <h1 class="page">选个题库，开始闯关</h1>
  <p class="lead">
    练习英语词汇，听美式发音并完成中英配对。课程词库包含 <span id="curTotal">—</span> 个词条、
    <span id="curUnits">—</span> 个单元，也可以上传自己的资料做成题库。
  </p>

  <!-- 默认题库 -->
  <div class="card" id="defaultCard" hidden>
    <h2>默认题库</h2>
    <p class="sub">系统内置，开箱即用</p>
    <div class="list" id="defaultList"></div>
  </div>

  <!-- 层级选择 -->
  <div class="card">
    <h2>按层级生成题库</h2>
    <p class="sub">第一级 学段 → 第二级 年级 → 第三级 册别 → 第四级 单元；每一级都可以自定义名称</p>
    <div id="levelBox"></div>
    <div class="msg info" id="selInfo"></div>
    <div class="actions">
      <button class="btn lg gold" id="btnMake">生成题库并开始</button>
      <button class="btn lg ghost" id="btnUpload">上传题库</button>
      <button class="btn lg ghost" id="btnOffline">生成离线测试</button>
    </div>
  </div>

  <!-- 题库列表 -->
  <div class="card">
    <h2>我的题库</h2>
    <p class="sub">生成过的题库都在这里，可以直接玩，也可以下载成离线网页</p>
    <div class="list" id="bankList"><div class="empty">加载中…</div></div>
  </div>

  <footer class="foot">
    玩法：点英文卡片听发音 → 点对应中文卡片配对成功 · 配对 +100 分，连击额外加分，答错扣 3 秒。<br>
    离线测试页是单个 HTML 文件，双击即可在没网的电脑上玩。
  </footer>
</div>

<div class="toast" id="toast"></div>
<script src="/word-puzzle/js/api.js?v=20261104-base"></script>
<script src="/word-puzzle/js/selector.js?v=20261104-volumes"></script>
<script src="/word-puzzle/js/page-home.js?v=20261104-base"></script>
<script src="/shared/module-header.js"></script>
</body>
</html>
