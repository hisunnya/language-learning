  <header class="portal-topbar">
    <a class="portal-brand" href="/word-puzzle/" aria-label="词境 Lexica">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="词汇练习" data-module-en="Vocabulary practice">词汇练习</small></span>
    </a>
    <nav class="portal-nav">
      <a href="/word-puzzle/" class="active" data-module-zh="首页" data-module-en="Home">首页</a>
      <a href="/word-puzzle/bank.html" class="admin-only" data-module-zh="题库工作台" data-module-en="Word banks">题库工作台</a>
      <a href="/word-puzzle/stats.html" data-module-zh="成绩记录" data-module-en="Scores">成绩记录</a>
    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <h1 class="page" data-module-zh="选个题库，开始闯关" data-module-en="Pick a word bank and start playing">选个题库，开始闯关</h1>
  <div class="card aw-news" id="awNews" hidden>
    <span class="aw-news-badge" id="awNewsBadge" aria-hidden="true"></span>
    <div class="main"><b id="awNewsTitle"></b></div>
    <a class="btn gold" href="/word-puzzle/me.html" id="awNewsGo" data-module-zh="去看看" data-module-en="Take a look">去看看</a>
  </div>
  <p class="lead">
    <span class="admin-only"><span data-module-zh="课程词库包含" data-module-en="The curriculum word bank has">课程词库包含</span>
    <span id="curTotal">—</span> <span data-module-zh="个词条、" data-module-en="words in">个词条、</span>
    <span id="curUnits">—</span> <span data-module-zh="个单元；也可以在题库工作台上传自己的词表做成题库。" data-module-en="units; you can also upload your own word list in the word bank workbench.">个单元；也可以在题库工作台上传自己的词表做成题库。</span></span>
  </p>

  <!-- 老师：新建、分类、标签、批量开放、删除、离线测试都在题库工作台 -->
  <div class="card admin-only">
    <h2 data-module-zh="管理题库" data-module-en="Manage word banks">管理题库</h2>
    <p class="sub" data-module-zh="新建题库、设置分类和标签、批量开放给班级、删除、导出离线测试，都在题库工作台里。" data-module-en="Create word banks, set categories and tags, release them to classes in bulk, delete them and export offline tests — all in the word bank workbench.">新建题库、设置分类和标签、批量开放给班级、删除、导出离线测试，都在题库工作台里。</p>
    <div class="actions">
      <a class="btn gold" href="/word-puzzle/bank.html#banks" data-module-zh="管理题库" data-module-en="Manage word banks">管理题库</a>
      <a class="btn ghost" href="/word-puzzle/bank.html#new" data-module-zh="新建题库" data-module-en="New word bank">新建题库</a>
    </div>
  </div>

  <!-- 题库列表 -->
  <div class="card">
    <h2 class="admin-only" data-module-zh="题库" data-module-en="Word banks">题库</h2>
    <p class="sub admin-only" data-module-zh="所有题库都在这里，点「开始游戏」就能玩。管理题库请去题库工作台。" data-module-en="All word banks are here; press “Play” to start. Manage word banks in the word bank workbench.">所有题库都在这里，点「开始游戏」就能玩。管理题库请去题库工作台。</p>
    <h2 class="student-only" data-module-zh="选个题库" data-module-en="Pick a word bank">选个题库</h2>
    <p class="sub student-only" data-module-zh="能玩的题库都在这里，点「开始游戏」就能玩" data-module-en="The word banks you can play are here. Press “Play” to start.">能玩的题库都在这里，点「开始游戏」就能玩</p>
    <div class="type-cards" id="typeCards" hidden></div>
    <div class="list" id="bankList"><div class="empty" data-module-zh="加载中…" data-module-en="Loading…">加载中…</div></div>
  </div>

  <!-- 最近玩过（这台设备上的记录；没有记录就不显示） -->
  <div class="card recent-card" id="recentCard" hidden>
    <h2 data-module-zh="最近玩过" data-module-en="Recently played">最近玩过</h2>
    <p class="sub" data-module-zh="点一下接着玩" data-module-en="Tap to continue">点一下接着玩</p>
    <div class="list" id="recentList"></div>
  </div>

  <footer class="foot">
    <span data-module-zh="玩法：点英文卡片听发音，再点中文卡片配对；也可以先选中文（不播放语音） · 配对 +50 分，连击额外加分，答错扣 3 秒。" data-module-en="How to play: tap an English card to hear it, then tap its Chinese card to match; you can also pick the Chinese card first (no audio) · +50 per match, bonus for combos, a wrong match costs 3 seconds.">玩法：点英文卡片听发音，再点中文卡片配对；也可以先选中文（不播放语音） · 配对 +50 分，连击额外加分，答错扣 3 秒。</span><br>
  </footer>
