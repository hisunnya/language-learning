<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="Vocabulary practice">英语词汇练习</small></span>

    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <section class="lb" aria-labelledby="lbTitle">
    <div class="lb-banner">
      <svg class="lb-trophy" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <defs><linearGradient id="lbTrophyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E8A100"/></linearGradient></defs>
        <path d="M18 8h28v14c0 9-6 16-14 16S18 31 18 22V8z" fill="url(#lbTrophyG)"/>
        <path d="M18 12H8c0 9 4 15 11 16M46 12h10c0 9-4 15-11 16" fill="none" stroke="#E8A100" stroke-width="4" stroke-linecap="round"/>
        <rect x="28" y="38" width="8" height="9" fill="#E8A100"/>
        <rect x="20" y="47" width="24" height="7" rx="3" fill="url(#lbTrophyG)"/>
      </svg>
      <div class="lb-banner-text">
        <h1 id="lbTitle" class="lb-title">积分榜</h1>
        <p class="lb-sub" data-module-zh="积分 = 所有游戏得分之和，只显示前十名" data-module-en="Points = the sum of all game scores. Top ten only.">积分 = 所有游戏得分之和，只显示前十名</p>
      </div>
    </div>

    <div class="lb-controls">
      <div class="lb-seg" role="group" aria-label="period">
        <button type="button" class="lb-seg-btn active" id="lbAll" data-period="all" aria-pressed="true" data-module-zh="总榜" data-module-en="All time">总榜</button>

      </div>
      <label class="lb-class" id="lbClassBox" hidden>
        <span data-module-zh="班级" data-module-en="Class">班级</span>
        <select id="lbClass"></select>
      </label>
    </div>

    <div class="lb-me" id="lbMe" hidden></div>
    <div id="lbPodium" class="lb-podium" aria-live="polite"></div>
    <ol id="lbList" class="lb-list"></ol>
    <div id="lbEmpty" class="lb-empty" hidden></div>
