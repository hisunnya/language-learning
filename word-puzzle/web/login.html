<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wp-base" content="/word-puzzle">
<meta name="robots" content="noindex">
<title>登录 · 词境 Lexica</title>
<link rel="icon" type="image/svg+xml" href="/word-puzzle/img/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/word-puzzle/img/icon-512.png">
<link rel="apple-touch-icon" href="/word-puzzle/img/apple-touch-icon.png">
<link rel="stylesheet" href="/word-puzzle/css/app.css?v=fd6a4039">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=95df7e0b">
<link rel="stylesheet" href="/shared/module-header.css?v=031d38e2">
</head>
<body data-auth="public">
<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/word-puzzle/" aria-label="词境 Lexica">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="词汇练习" data-module-en="Vocabulary practice">词汇练习</small></span>
    </a>
    <nav class="portal-nav"></nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <div class="card auth-card">
    <h2 data-module-zh="请登录" data-module-en="Please sign in">请登录</h2>
    <p class="hint" id="guestHint" hidden data-module-zh="这是家庭版入口：不登录也能做题；管理题库、标签、账号、访问记录时才需要教师登录。教师账号和学生版是同一套。" data-module-en="This is the home entrance: you can play without signing in; managing word banks, tags, accounts and visits needs a teacher sign-in. The teacher account is the same as on the student edition.">这是家庭版入口：不登录也能做题；管理题库、标签、账号、访问记录时才需要教师登录。教师账号和学生版是同一套。</p>
    <form id="loginForm" autocomplete="on" novalidate>
      <div class="field">
        <label for="studentNo" data-module-zh="用户名" data-module-en="Username">用户名</label>
        <input type="text" id="studentNo" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="64" required>
      </div>
      <div class="field">
        <label for="password" data-module-zh="密码" data-module-en="Password">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required>
      </div>
      <div class="msg" id="loginMsg" role="alert"></div>
      <div class="actions">
        <button class="btn gold" type="submit" id="btnLogin" data-module-zh="登录" data-module-en="Sign in">登录</button>
      </div>
    </form>
    <p class="hint" data-module-zh="忘记密码？请联系管理员重置。连续输错 5 次会临时锁定 15 分钟。" data-module-en="Forgot your password? Ask an administrator to reset it. Five wrong tries in a row lock the account for 15 minutes.">忘记密码？请联系管理员重置。连续输错 5 次会临时锁定 15 分钟。</p>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="/word-puzzle/js/api.js?v=dc50c220"></script>
<script src="/word-puzzle/js/auth-ui.js?v=6f45b08e"></script>
<script src="/word-puzzle/js/tracker.js?v=72afc496"></script>
<script src="/word-puzzle/js/page-login.js?v=b249b739"></script>
<script src="/shared/module-header.js?v=0b00f0ec"></script>
<script src="/shared/site-footer.js?v=9d9c1f36"></script>
</body>
</html>
