<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>(function(){var h=document.documentElement,r='';try{r=sessionStorage.getItem('wp_role')||''}catch(e){}h.classList.add(r==='student'?'role-student':r==='admin'?'role-admin':'role-pending')})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wp-base" content="/word-puzzle">
<meta name="robots" content="noindex">
<title data-module-zh="访问记录 · 词境 Lexica" data-module-en="Visits · Lexica">访问记录 · 词境 Lexica</title>
<link rel="icon" type="image/svg+xml" href="/word-puzzle/img/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/word-puzzle/img/icon-512.png">
<link rel="apple-touch-icon" href="/word-puzzle/img/apple-touch-icon.png">
<link rel="stylesheet" href="/word-puzzle/css/app.css?v=20261104-theme">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=20261115-visits2">
<link rel="stylesheet" href="/shared/module-header.css?v=20261113-logo">
</head>
<body data-auth="visits">
<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/word-puzzle/" aria-label="词境 Lexica">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="English vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav">
      <a href="/word-puzzle/" data-module-zh="首页" data-module-en="Home">首页</a>
      <a href="/word-puzzle/bank.html" class="admin-only" data-module-zh="题库工作台" data-module-en="Banks">题库工作台</a>
      <a href="/word-puzzle/stats.html" data-module-zh="成绩记录" data-module-en="Scores">成绩记录</a>
    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <div class="card">
    <h2 data-module-zh="访问记录" data-module-en="Visits">访问记录</h2>
    <p class="sub" data-module-zh="谁、从哪个 IP、用什么设备和浏览器、什么时候来、看了哪些页面、每页停了多久，永久保留。「一次访问」= 同一个浏览器标签页里先后打开的页面；点一行展开，看每一页。停留时间只算页面在前台的秒数（切到别的标签页、锁屏不算）。IP 是服务器看到的来访地址，手机流量、学校出口、家里宽带下同一出口的人 IP 可能相同。" data-module-en="Who, from which IP, on what device and browser, when, which pages and how long on each, kept permanently. One “visit” = the pages opened one after another in the same browser tab; press a row to see every page. Time on page counts only the seconds the page was in the foreground (another tab or a locked screen does not count). The IP is the address the server saw; people behind the same mobile carrier, campus gateway or home router can share one.">谁、从哪个 IP、用什么设备和浏览器、什么时候来、看了哪些页面、每页停了多久，永久保留。「一次访问」= 同一个浏览器标签页里先后打开的页面；点一行展开，看每一页。停留时间只算页面在前台的秒数（切到别的标签页、锁屏不算）。IP 是服务器看到的来访地址，手机流量、学校出口、家里宽带下同一出口的人 IP 可能相同。</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tabVisits" role="tab" aria-selected="true" data-module-zh="访问" data-module-en="Visits">访问</button>
      <button type="button" class="tab" id="tabLogins" role="tab" aria-selected="false" data-module-zh="登录记录" data-module-en="Sign-ins">登录记录</button>
    </div>

    <div class="admin-filters">
      <div class="field"><label for="fWho" data-module-zh="对象" data-module-en="Who">对象</label>
        <select id="fWho"><option value="" data-module-zh="全部" data-module-en="Everyone">全部</option><option value="student" data-module-zh="学生" data-module-en="Students">学生</option><option value="admin" data-module-zh="老师" data-module-en="Teachers">老师</option><option value="anonymous" data-module-zh="未登录" data-module-en="Not signed in">未登录</option></select></div>
      <div class="field"><label for="fClass" data-module-zh="班级" data-module-en="Class">班级</label><input type="text" id="fClass" maxlength="60"></div>
      <div class="field"><label for="fSearch" data-module-zh="搜索学号、姓名、IP、设备" data-module-en="Search number, name, IP, device">搜索学号、姓名、IP、设备</label><input type="text" id="fSearch" maxlength="60"></div>
      <div class="field"><label for="fSince" data-module-zh="起始日期" data-module-en="From date">起始日期</label><input type="date" id="fSince"></div>
      <div class="field"><label for="fUntil" data-module-zh="截止日期" data-module-en="To date">截止日期</label><input type="date" id="fUntil"></div>
      <label class="check" id="failedBox" hidden><input type="checkbox" id="fFailed"> <span data-module-zh="只看失败的" data-module-en="Failed only">只看失败的</span></label>
      <a class="btn ghost" id="btnExport" href="#" data-module-zh="导出完整 CSV" data-module-en="Export full CSV">导出完整 CSV</a>
    </div>
    <p class="hint" id="countHint" aria-live="polite"></p>
    <p class="hint warn" id="ipWarn" hidden></p>

    <div class="scroll"><table class="tbl" id="visitTable">
      <thead><tr>
        <th class="caret-col"></th>
        <th data-module-zh="时间" data-module-en="Time">时间</th><th data-module-zh="班级" data-module-en="Class">班级</th><th data-module-zh="学号" data-module-en="No.">学号</th><th data-module-zh="姓名" data-module-en="Name">姓名</th>
        <th>IP</th><th data-module-zh="设备" data-module-en="Device">设备</th><th data-module-zh="系统" data-module-en="OS">系统</th><th data-module-zh="浏览器" data-module-en="Browser">浏览器</th><th data-module-zh="页数" data-module-en="Pages">页数</th><th data-module-zh="停留" data-module-en="Time on pages">停留</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>

    <div class="scroll"><table class="tbl" id="loginTable" hidden>
      <thead><tr>
        <th data-module-zh="时间" data-module-en="Time">时间</th><th data-module-zh="结果" data-module-en="Result">结果</th><th data-module-zh="输入的学号" data-module-en="Number typed">输入的学号</th><th data-module-zh="姓名" data-module-en="Name">姓名</th><th data-module-zh="班级" data-module-en="Class">班级</th>
        <th>IP</th><th data-module-zh="设备" data-module-en="Device">设备</th><th data-module-zh="系统" data-module-en="OS">系统</th><th data-module-zh="浏览器" data-module-en="Browser">浏览器</th><th data-module-zh="原因" data-module-en="Reason">原因</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
    <p><button type="button" class="btn ghost" id="btnMore" hidden data-module-zh="加载更多" data-module-en="Load more">加载更多</button></p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/word-puzzle/js/i18n.js?v=20261114-i18n"></script>
<script src="/word-puzzle/js/i18n-lexica.js?v=20261115-visits"></script>
<script src="/word-puzzle/js/api.js?v=20261104-base"></script>
<script src="/word-puzzle/js/auth-ui.js?v=20261115-visits"></script>
<script src="/word-puzzle/js/tracker.js?v=20261115-visits"></script>
<script src="/word-puzzle/js/page-visits.js?v=20261115-visits"></script>
<script src="/shared/module-header.js"></script>
</body>
</html>
