<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="wp-base" content="/word-puzzle">
<title>词境 Lexica</title>
<link rel="stylesheet" href="/word-puzzle/css/game.css?v=20261107-exit-link">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=20261112-auth">
<link rel="stylesheet" href="/shared/module-header.css?v=20261104-compact2">
</head>
<body>
<div class="app">
  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
      <span class="portal-brand-mark" aria-hidden="true">词</span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="English vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav portal-nav--compact"><a class="active" href="/" data-module-zh="返回网站主页" data-module-en="Website home">返回网站主页</a></nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>
  <div class="hud">
    <div class="hud-row">
      <div class="stat"><span class="k">关卡</span><span class="v" id="s-level">1/1</span></div>
      <div class="stat time" id="s-timebox"><span class="k">剩余</span><span class="v" id="s-time">60</span></div>
      <div class="stat"><span class="k">进度</span><span class="v" id="s-prog">0/8</span></div>
      <div class="stat score"><span class="k">得分</span><span class="v" id="s-score">0</span></div>
      <div class="stat"><span class="k">连击</span><span class="v" id="s-combo">0</span></div>
    </div>
    <div class="progress"><i id="s-bar"></i></div>
    <div class="ptext"><span id="s-tip">点任意一张卡片，再点另一侧配对</span><span id="s-total">总分 0</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="bar">
    <button class="btn ghost sm" id="btn-help">玩法</button>
    <button class="btn ghost sm" id="btn-full">全屏</button>
    <button class="btn warn" id="btn-replay">重玩本关</button>
    <button class="btn" id="btn-restart">从头开始</button>
  </div>
</div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script src="/word-puzzle/js/api.js?v=20261104-base"></script>
<script src="/word-puzzle/js/auth-ui.js?v=20261112-auth"></script>
<script src="/word-puzzle/js/game-core.js"></script>
<script src="/word-puzzle/js/game-ui.js?v=20261107-exit-link"></script>
<script src="/word-puzzle/js/game-adapter-online.js?v=20261104-base"></script>
<script src="/word-puzzle/js/page-play.js?v=20261107-sitehome"></script>
<script src="/shared/module-header.js"></script>
</body>
</html>
