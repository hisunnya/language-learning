<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>(function(){var h=document.documentElement,r='';try{r=sessionStorage.getItem('wp_role')||''}catch(e){}h.classList.add(r==='student'?'role-student':r==='admin'?'role-admin':'role-pending')})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="wp-base" content="/word-puzzle">
<title data-module-zh="词境 Lexica" data-module-en="Lexica">词境 Lexica</title>
<link rel="icon" type="image/svg+xml" href="/word-puzzle/img/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/word-puzzle/img/icon-512.png">
<link rel="apple-touch-icon" href="/word-puzzle/img/apple-touch-icon.png">
<link rel="stylesheet" href="/word-puzzle/css/game.css?v=969452fe">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=0185089d">
<link rel="stylesheet" href="/shared/module-header.css?v=031d38e2">
</head>
<body>
<div class="app">
  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="Vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav portal-nav--compact"><a class="active" href="/" data-module-zh="返回网站主页" data-module-en="Website home">返回网站主页</a></nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>
  <div class="hud">
    <div class="hud-row">
      <div class="stat"><span class="k" data-module-zh="关卡" data-module-en="Level">关卡</span><span class="v" id="s-level">1/1</span></div>
      <div class="stat time" id="s-timebox"><span class="k" data-module-zh="剩余" data-module-en="Time">剩余</span><span class="v" id="s-time">60</span></div>
      <div class="stat"><span class="k" data-module-zh="进度" data-module-en="Progress">进度</span><span class="v" id="s-prog">0/8</span></div>
      <div class="stat score"><span class="k" data-module-zh="得分" data-module-en="Score">得分</span><span class="v" id="s-score">0</span></div>
      <div class="stat"><span class="k" data-module-zh="连击" data-module-en="Combo">连击</span><span class="v" id="s-combo">0</span></div>
    </div>
    <div class="progress"><i id="s-bar"></i></div>
    <div class="ptext"><span id="s-tip" data-module-zh="点任意一张卡片，再点另一侧配对" data-module-en="Tap any card, then tap one on the other side to match">点任意一张卡片，再点另一侧配对</span><span id="s-total" data-module-zh="总分 0" data-module-en="Total 0">总分 0</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="bar">
    <button class="btn ghost sm" id="btn-help" data-module-zh="玩法" data-module-en="How to play">玩法</button>
    <button class="btn ghost sm" id="btn-full" data-module-zh="全屏" data-module-en="Full screen">全屏</button>
    <button class="btn warn" id="btn-replay" data-module-zh="重玩本关" data-module-en="Replay level">重玩本关</button>
    <button class="btn" id="btn-restart" data-module-zh="从头开始" data-module-en="Start over">从头开始</button>
  </div>
</div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script src="/word-puzzle/js/i18n.js?v=2fe864c4"></script>
<script src="/word-puzzle/js/i18n-lexica.js?v=54a2a0ae"></script>
<script src="/word-puzzle/js/api.js?v=e44053c6"></script>
<script src="/word-puzzle/js/auth-ui.js?v=ec37383f"></script>
<script src="/word-puzzle/js/tracker.js?v=72afc496"></script>
<script src="/word-puzzle/js/recent.js?v=868a2d31"></script>
<script src="/word-puzzle/js/game-core.js?v=ffcd02cd"></script>
<script src="/word-puzzle/js/game-ui.js?v=70e67365"></script>
<script src="/word-puzzle/js/game-adapter-online.js?v=d187753c"></script>
<script src="/word-puzzle/js/page-play.js?v=da6b120d"></script>
<script src="/shared/module-header.js?v=0b00f0ec"></script>
</body>
</html>
