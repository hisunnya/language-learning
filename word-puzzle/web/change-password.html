<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wp-base" content="/word-puzzle">
<meta name="robots" content="noindex">
<title>修改密码 · 词境 Lexica</title>
<link rel="stylesheet" href="/word-puzzle/css/app.css?v=20261104-theme">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=20261112-auth">
<link rel="stylesheet" href="/shared/module-header.css?v=20261104-compact2">
</head>
<body data-auth="change">
<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/word-puzzle/" aria-label="词境 Lexica">
      <span class="portal-brand-mark" aria-hidden="true">词</span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="English vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav"></nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <div class="card auth-card">
    <h2 data-module-zh="修改密码" data-module-en="Change password">修改密码</h2>
    <p class="sub" id="changeIntro" data-module-zh="为了安全，请把老师发的初始密码改成只有你自己知道的新密码。" data-module-en="For safety, replace the initial password with one only you know.">为了安全，请把老师发的初始密码改成只有你自己知道的新密码。</p>
    <form id="changeForm" autocomplete="off" novalidate>
      <div class="field">
        <label for="oldPassword" data-module-zh="当前密码（初始密码）" data-module-en="Current password (initial password)">当前密码（初始密码）</label>
        <input type="password" id="oldPassword" autocomplete="current-password" maxlength="128" required>
      </div>
      <div class="field">
        <label for="newPassword" data-module-zh="新密码" data-module-en="New password">新密码</label>
        <input type="password" id="newPassword" autocomplete="new-password" maxlength="128" required>
        <ul class="rules">
          <li data-module-zh="至少 8 位" data-module-en="At least 8 characters">至少 8 位</li>
          <li data-module-zh="字母、数字、符号至少用两种" data-module-en="Mix at least two kinds: letters, digits, symbols">字母、数字、符号至少用两种</li>
          <li data-module-zh="不能包含学号，也不要用生日、手机号" data-module-en="No student number, birthday or phone number">不能包含学号，也不要用生日、手机号</li>
        </ul>
      </div>
      <div class="field">
        <label for="newPassword2" data-module-zh="再输一遍新密码" data-module-en="New password again">再输一遍新密码</label>
        <input type="password" id="newPassword2" autocomplete="new-password" maxlength="128" required>
      </div>
      <div class="msg" id="changeMsg" role="alert"></div>
      <div class="actions">
        <button class="btn lg gold" type="submit" id="btnChange" data-module-zh="保存新密码" data-module-en="Save new password">保存新密码</button>
      </div>
    </form>
    <p class="auth-links" id="cancelLink" hidden><a href="/word-puzzle/" data-module-zh="先不改了，回首页" data-module-en="Not now, back to home">先不改了，回首页</a></p>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="/word-puzzle/js/api.js?v=20261112-auth"></script>
<script src="/word-puzzle/js/auth-ui.js?v=20261112-auth"></script>
<script src="/word-puzzle/js/page-password.js?v=20261112-auth"></script>
<script src="/shared/module-header.js"></script>
</body>
</html>
