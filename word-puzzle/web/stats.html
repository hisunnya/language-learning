<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wp-base" content="/word-puzzle">
<title>成绩记录 · 词境 Lexica</title>
<link rel="icon" type="image/svg+xml" href="/word-puzzle/img/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/word-puzzle/img/icon-512.png">
<link rel="apple-touch-icon" href="/word-puzzle/img/apple-touch-icon.png">
<link rel="stylesheet" href="/word-puzzle/css/app.css?v=20261104-theme">
<link rel="stylesheet" href="/word-puzzle/css/auth.css?v=20261112-auth">
<link rel="stylesheet" href="/shared/module-header.css?v=20261113-logo">
</head>
<body>
<div class="wrap">

  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="语林 Lingua Grove">
      <span class="portal-brand-mark portal-brand-mark--logo" aria-hidden="true"><img src="/word-puzzle/img/icon.svg" alt="" width="40" height="40"></span>
        <span class="portal-brand-copy"><strong><span data-module-zh="词境" data-module-en="Lexica">词境</span><em>LEXICA</em></strong><small data-module-zh="英语词汇练习" data-module-en="English vocabulary practice">英语词汇练习</small></span>
    </a>
    <nav class="portal-nav">
      <a href="/word-puzzle/" data-module-zh="首页" data-module-en="Home">首页</a>
      <a href="/word-puzzle/bank.html" class="admin-only" data-module-zh="题库工作台" data-module-en="Banks">题库工作台</a>
      <a href="/word-puzzle/stats.html" class="active" data-module-zh="成绩记录" data-module-en="Scores">成绩记录</a>
    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <div class="stats" id="statCards">
    <div class="stat"><div class="k">总场次</div><div class="v blue" id="sCount">—</div></div>
    <div class="stat"><div class="k">最高分</div><div class="v orange" id="sBest">—</div></div>
    <div class="stat"><div class="k">平均分</div><div class="v" id="sAvg">—</div></div>
    <div class="stat"><div class="k">累计得分</div><div class="v green" id="sTotal">—</div></div>
  </div>

  <div class="card">
    <h2>按题库统计</h2>
    <p class="sub">每个题库玩了多少次、最高多少分</p>
    <div class="scroll"><table class="tbl" id="byBankTable">
      <thead><tr><th>题库</th><th>次数</th><th>最高分</th><th>累计</th></tr></thead>
      <tbody><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>成绩明细</h2>
    <p class="sub">最近 200 条</p>
    <div class="scroll"><table class="tbl" id="scoreTable">
      <thead><tr>
        <th>时间</th><th>题库</th><th>得分</th><th>配对</th>
        <th>答错</th><th>最高连击</th><th>用时</th><th>关数</th>
      </tr></thead>
      <tbody><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
    </table></div>
  </div>

  <footer class="foot">
    离线测试页的成绩存在浏览器本地（localStorage），不会出现在这里；<br>
    同一台设备上重复玩，排名按最高分计。
  </footer>
</div>

<div class="toast" id="toast"></div>
<script src="/word-puzzle/js/api.js?v=20261104-base"></script>
<script src="/word-puzzle/js/auth-ui.js?v=20261112-auth"></script>
<script src="/word-puzzle/js/page-stats.js?v=20261104-base"></script>
<script src="/shared/module-header.js"></script>
</body>
</html>
