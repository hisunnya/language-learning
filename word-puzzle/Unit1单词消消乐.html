<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Unit 1 单词消消乐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:linear-gradient(160deg,#eaf4ff 0%,#f7fbff 45%,#fff6ec 100%);color:#1f2d3d;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{display:flex;flex-direction:column;height:100%;max-width:980px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}

/* ---------- HUD ---------- */
.hud{background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(30,64,120,.10);padding:8px 12px;margin-bottom:8px;flex:0 0 auto}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:58px}
.stat .k{font-size:11px;color:#8494a8;letter-spacing:.5px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.time .v{color:#1f7ae0}
.stat.time.warn .v{color:#e5484d;animation:pulse .7s infinite}
.stat.score .v{color:#f0801a}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.progress{margin-top:7px;height:8px;background:#e8eef6;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4cc9a0,#38b6ff);transition:width .35s ease}
.ptext{margin-top:5px;font-size:12px;color:#6b7c93;display:flex;justify-content:space-between}

/* ---------- Board ---------- */
.board{flex:1 1 auto;display:grid;gap:8px;align-content:stretch;grid-auto-rows:minmax(74px,1fr);overflow-y:auto;padding:2px}
.card{position:relative;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(30,64,120,.12);padding:8px 6px 9px;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
transition:transform .16s ease,box-shadow .16s ease,opacity .3s ease;min-height:74px;overflow:hidden}
.card:active{transform:scale(.96)}
.card .tag{position:absolute;top:4px;left:6px;font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.55}
.card.en{background:linear-gradient(180deg,#ffffff,#eaf3ff);border:1.5px solid #d7e7fb}
.card.en .tag{color:#1f7ae0}
.card.cn{background:linear-gradient(180deg,#ffffff,#fff3e6);border:1.5px solid #fde3c8}
.card.cn .tag{color:#e07b1a}
.card .w{font-size:clamp(15px,3.6vw,21px);font-weight:800;line-height:1.2;word-break:break-word;padding:0 2px}
.card.en .w{color:#123a6b}
.card.cn .w{color:#7a3d05;font-weight:700}
.card .ipa{font-size:clamp(9px,2.2vw,12px);color:#8aa0bb;margin-top:3px;font-family:"Times New Roman",Georgia,serif}
.card .say{position:absolute;right:5px;bottom:4px;font-size:11px;opacity:.35}
.card.sel{transform:scale(1.06);box-shadow:0 0 0 3px #ffb703,0 8px 20px rgba(255,183,3,.35);z-index:2}
.card.sel::after{content:"";position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 50% 0%,rgba(255,220,120,.35),transparent 60%)}
.card.matched{animation:pop .46s ease forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1);opacity:1}35%{transform:scale(1.16) rotate(-2deg)}100%{transform:scale(.15) rotate(12deg);opacity:0}}
.card.bad{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.card.hint{animation:blink .5s ease 2}
@keyframes blink{0%,100%{box-shadow:0 3px 10px rgba(30,64,120,.12)}50%{box-shadow:0 0 0 3px #4cc9a0}}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pt{position:absolute;font-size:20px;animation:fly .72s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.35) rotate(var(--rot));opacity:0}}
.plus{position:absolute;font-weight:900;font-size:22px;color:#f0801a;text-shadow:0 2px 6px rgba(255,255,255,.9);animation:up 1s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}100%{transform:translate(-50%,-160%) scale(1.1);opacity:0}}
.combo{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:70;font-size:30px;font-weight:900;color:#ff7a18;text-shadow:0 3px 10px rgba(255,255,255,.9);pointer-events:none;animation:cin 1s ease-out forwards}
@keyframes cin{0%{transform:translateX(-50%) scale(.5);opacity:0}30%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-40px);opacity:0}}

/* ---------- Bottom bar ---------- */
.bar{flex:0 0 auto;display:flex;gap:8px;padding-top:8px}
.btn{flex:1;border:none;border-radius:13px;padding:11px 6px;font-size:14px;font-weight:700;color:#fff;background:#4a90d9;
box-shadow:0 3px 0 #3574b5;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3574b5}
.btn.ghost{background:#fff;color:#3f5b78;box-shadow:0 3px 0 #d7e2ee}
.btn.warn{background:#ff8c42;box-shadow:0 3px 0 #d96c22}
.btn.gold{background:#ffb703;box-shadow:0 3px 0 #d18f00;color:#3d2a00}
.btn.sm{flex:0 0 auto;padding:11px 14px;font-size:13px}

/* ---------- Overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,36,58,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:22px;padding:22px 20px;width:100%;max-width:460px;box-shadow:0 18px 50px rgba(0,0,0,.25);text-align:center;max-height:92vh;overflow-y:auto}
.panel h1{margin:0 0 6px;font-size:28px;color:#123a6b}
.panel h2{margin:0 0 8px;font-size:24px;color:#123a6b}
.panel p{margin:6px 0;font-size:14px;color:#5b6d85;line-height:1.7}
.big{font-size:46px;font-weight:900;color:#f0801a;font-variant-numeric:tabular-nums;margin:6px 0}
.kv{display:flex;justify-content:space-between;font-size:15px;padding:8px 12px;background:#f4f8fd;border-radius:11px;margin:7px 0;color:#3c526d}
.kv b{color:#123a6b}
.rows{margin:12px 0;text-align:left}
.lvbtn{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lvbtn button{border:1.5px solid #cfe0f2;background:#f2f8ff;color:#1f5f9e;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.lvbtn button.on{background:#1f7ae0;color:#fff;border-color:#1f7ae0}
.rule{background:#f7fafd;border-radius:14px;padding:12px 14px;text-align:left;margin:10px 0}
.rule div{font-size:13.5px;color:#46607c;margin:5px 0;line-height:1.6}
.rule b{color:#123a6b}
.list{text-align:left;margin:10px 0}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#f7fafd;margin:4px 0;cursor:pointer}
.item:active{background:#e9f2fd}
.item .e{font-weight:800;color:#123a6b;flex:0 0 auto;max-width:48%}
.item .i{color:#8aa0bb;font-size:11px;font-family:"Times New Roman",serif}
.item .c{color:#7a3d05;margin-left:auto;text-align:right;font-size:13px}
.lvhead{font-size:12px;color:#8494a8;margin:10px 0 4px;text-align:left;font-weight:700}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(23,42,66,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:120;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media(max-width:360px){.stat .v{font-size:17px}.card .w{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="hud-row">
      <div class="stat"><span class="k">关卡</span><span class="v" id="s-level">1/7</span></div>
      <div class="stat time" id="s-timebox"><span class="k">剩余</span><span class="v" id="s-time">60</span></div>
      <div class="stat"><span class="k">进度</span><span class="v" id="s-prog">0/8</span></div>
      <div class="stat score"><span class="k">得分</span><span class="v" id="s-score">0</span></div>
      <div class="stat"><span class="k">连击</span><span class="v" id="s-combo">0</span></div>
    </div>
    <div class="progress"><i id="s-bar"></i></div>
    <div class="ptext"><span id="s-tip">点英文单词听发音，再点对应中文</span><span id="s-total">总分 0</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="bar">
    <button class="btn ghost sm" id="btn-help">玩法</button>
    <button class="btn ghost sm" id="btn-full">全屏</button>
    <button class="btn warn" id="btn-replay">重玩本关</button>
    <button class="btn" id="btn-restart">从头开始</button>
  </div>
</div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

var LEVEL_TIME = 120;   /* 每关基础时间（秒） */
var LEVEL_BONUS_MAX = 30;  /* 过关结转到下一关的最多奖励秒数 */
var LEVELS = (function(){
  var m = {}, out = [];
  WORDS.forEach(function(w,i){ w.id = i; (m[w.lv] = m[w.lv] || []).push(w); });
  Object.keys(m).map(Number).sort(function(a,b){return a-b;}).forEach(function(k){ out.push(m[k]); });
  return out;
})();

var st = {
  lv: 0, score: 0, total: 0, matched: 0, total_pairs: 0,
  sel: null, combo: 0, best: 0, wrong: 0,
  timeLeft: LEVEL_TIME, limit: LEVEL_TIME, endAt: 0, timer: null, playing: false, startedAt: 0, gen: 0
};
var $ = function(id){ return document.getElementById(id); };
var fx = $('fx');
var ac = null;

/* ---------- 音效（WebAudio 合成，无外部文件） ---------- */
function beep(freqs, dur, type, vol){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    freqs.forEach(function(f,i){
      var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i*dur*0.62;
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.02);
    });
  }catch(e){}
}
var sfx = {
  right: function(){ beep([784,1046.5],0.16,'triangle',0.16); },
  wrong: function(){ beep([180,120],0.16,'sawtooth',0.09); },
  combo: function(n){ beep([880+Math.min(n,8)*60, 1174+Math.min(n,8)*80],0.14,'triangle',0.15); },
  win: function(){ beep([523,659,784,1046],0.22,'triangle',0.16); },
  lose: function(){ beep([392,330,262],0.24,'sine',0.14); },
  click: function(){ beep([660],0.07,'sine',0.07); }
};

/* ---------- 朗读 ---------- */
var audioCache = {};
function fallbackSpeak(en){
  try{
    if(window.speechSynthesis){
      var u = new SpeechSynthesisUtterance(en);
      u.lang='en-US'; u.rate=0.85;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      return true;
    }
  }catch(e){}
  return false;
}
function speak(en, slug){
  if(AUDIO[slug]){
    try{
      if(!audioCache[slug]){
        var a = new Audio(AUDIO[slug]);
        a.preload='auto';
        a.addEventListener('error', function(){ audioCache[slug]=null; fallbackSpeak(en); });
        audioCache[slug] = a;
      }
      var au = audioCache[slug];
      if(au){
        au.pause();
        au.currentTime = 0;
        var pr = au.play();
        if(pr && pr.catch) pr.catch(function(){ fallbackSpeak(en); });
        return true;
      }
    }catch(e){}
  }
  return fallbackSpeak(en);
}

/* ---------- 工具 ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); },1600);
}

/* ---------- 渲染 HUD ---------- */
function render(){
  $('s-level').textContent = (st.lv+1)+'/'+LEVELS.length;
  $('s-time').textContent = fmtTime(st.timeLeft);
  $('s-timebox').classList.toggle('warn', st.timeLeft<=10 && st.playing);
  $('s-prog').textContent = st.matched+'/'+st.total_pairs;
  $('s-score').textContent = st.score;
  st.total = st.score;
  $('s-total').textContent = '总分 '+st.total;
  $('s-combo').textContent = st.combo;
  $('s-bar').style.width = (st.total_pairs? st.matched/st.total_pairs*100 : 0)+'%';
}

/* ---------- 棋盘 ---------- */
function buildBoard(){
  var pairs = LEVELS[st.lv];
  st.total_pairs = pairs.length;
  st.matched = 0; st.sel = null; st.combo = 0; st.wrong = 0;
  st.timeLeft = st.limit; st.playing = true; st.startedAt = Date.now();
  st.levelStartScore = st.score; st.gen++;
  var cards = [];
  pairs.forEach(function(w){
    cards.push({t:'en', id:w.id, w:w});
    cards.push({t:'cn', id:w.id, w:w});
  });
  shuffle(cards);
  var html = '';
  cards.forEach(function(c){
    if(c.t==='en'){
      html += '<div class="card en" data-id="'+c.id+'" data-t="en"><span class="tag">EN</span><div class="w">'+esc(c.w.en)+'</div>'+
              (c.w.ipa?'<div class="ipa">'+esc(c.w.ipa)+'</div>':'')+'<span class="say">🔊</span></div>';
    }else{
      html += '<div class="card cn" data-id="'+c.id+'" data-t="cn"><span class="tag">中</span><div class="w">'+esc(c.w.cn)+'</div></div>';
    }
  });
  var b=$('board'); b.innerHTML=html;
  layoutCols();
  if(st.timer) clearInterval(st.timer);
  st.timer = setInterval(tick,200);
  render();
}
function layoutCols(){
  var b=$('board'); if(!b) return;
  var w = b.clientWidth || window.innerWidth;
  var cols = w<360?2:(w<520?3:(w<760?4:(w<980?5:6)));
  b.style.gridTemplateColumns='repeat('+cols+',1fr)';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 计时 ---------- */
function tick(){
  if(!st.playing) return;
  st.timeLeft = st.limit - (Date.now()-st.startedAt)/1000;
  if(st.timeLeft<=0){ st.timeLeft=0; render(); timeUp(); return; }
  render();
}

/* ---------- 点击 ---------- */
$('board').addEventListener('click', function(ev){
  var el = ev.target.closest('.card');
  if(!el || !st.playing) return;
  var id = +el.getAttribute('data-id'), t = el.getAttribute('data-t');
  var w = WORDS[id];
  if(t==='en'){
    if(st.sel && st.sel.el===el){
      /* 再点同一个单词：重新朗读发音，保持选中状态 */
      speak(w.en, slugify(w.en));
      sfx.click();
      return;
    }
    if(st.sel) st.sel.el.classList.remove('sel');
    st.sel = {id:id, el:el};
    el.classList.add('sel');
    speak(w.en, slugify(w.en));
    sfx.click();
    return;
  }
  if(!st.sel){
    toast('先点一个英文单词，再点中文');
    el.classList.add('hint'); setTimeout(function(){el.classList.remove('hint');},1000);
    return;
  }
  if(st.sel.id===id){
    /* 配对成功 */
    var enEl = st.sel.el;
    enEl.classList.remove('sel'); st.sel = null;
    var gain = 100 + Math.min(st.combo,5)*20;
    st.combo++; st.best = Math.max(st.best, st.combo);
    st.score += gain; st.matched++;
    sfx.right();
    if(st.combo>=2){ sfx.combo(); showCombo(st.combo); }
    burst(enEl); burst(el);
    floatPlus(el, '+'+gain);
    [enEl,el].forEach(function(e){ e.classList.add('matched'); });
    setTimeout(function(){
      enEl.style.display='none'; el.style.display='none';
      render();
      if(!st.playing) return;
      if(st.matched>=st.total_pairs) levelClear();
    },430);
    render();
  }else{
    /* 配对错误 */
    st.combo=0; st.wrong++; st.score=Math.max(0, st.score-20);
    st.startedAt -= 3000; st.timeLeft = Math.max(0, st.timeLeft-3);
    sfx.wrong();
    var cn = el, en = st.sel.el;
    [cn,en].forEach(function(e){ e.classList.remove('bad'); void e.offsetWidth; e.classList.add('bad'); });
    st.sel.el.classList.remove('sel'); st.sel=null;
    toast('不对哦，-3 秒');
    render();
  }
});

/* ---------- 特效 ---------- */
function burst(card){
  var r = card.getBoundingClientRect();
  var cx = r.left+r.width/2, cy = r.top+r.height/2;
  var emo = ['✨','⭐','🎉','💫','🌟','🎈'];
  for(var i=0;i<14;i++){
    var s = document.createElement('span');
    s.className='pt';
    s.textContent = emo[i%emo.length];
    var ang = (Math.PI*2/14)*i + Math.random()*0.5;
    var dist = 40+Math.random()*70;
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    s.style.fontSize=(15+Math.random()*12)+'px';
    fx.appendChild(s);
    (function(n){ setTimeout(function(){ n.remove(); },760); })(s);
  }
}
function floatPlus(card, txt){
  var r = card.getBoundingClientRect();
  var s = document.createElement('div');
  s.className='plus'; s.textContent=txt;
  s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px';
  fx.appendChild(s); setTimeout(function(){s.remove();},1050);
}
function showCombo(n){
  var s=document.createElement('div'); s.className='combo'; s.textContent='连击 x'+n;
  fx.appendChild(s); setTimeout(function(){s.remove();},1050);
}

/* ---------- 关卡结算 ---------- */
function stopTimer(){ if(st.timer){clearInterval(st.timer); st.timer=null;} st.playing=false; }
function levelClear(){
  stopTimer();
  sfx.win();
  var bonus = Math.floor(st.timeLeft)*10;
  st.score += bonus; st.total = st.score;
  var nextBonus = Math.min(LEVEL_BONUS_MAX, Math.floor(st.timeLeft/2));
  var nextLimit = Math.min(st.limit + nextBonus, LEVEL_TIME + LEVEL_BONUS_MAX);
  var g = st.gen;
  setTimeout(function(){
    if(st.gen!==g) return;   /* 玩家已重开/重置，放弃本次结算面板 */
    var html='<h2>第 '+(st.lv+1)+' 关 通关！</h2>'+
      '<div class="big">'+st.score+'</div>'+
      '<div class="kv"><span>本关配对</span><b>'+st.total_pairs+' / '+st.total_pairs+'</b></div>'+
      '<div class="kv"><span>剩余时间奖励</span><b>+'+bonus+' 分</b></div>'+
      '<div class="kv"><span>最高连击</span><b>x'+st.best+'</b></div>';
    if(st.lv < LEVELS.length-1){
      html += '<p>下一关时间：'+nextLimit+' 秒（奖励 +'+nextBonus+'s）</p>'+
        '<button class="btn gold" id="ov-next" style="margin-top:12px">进入第 '+(st.lv+2)+' 关</button>';
    }else{
      html += '<p style="font-size:16px;color:#f0801a;font-weight:800">全部通关！总分 '+st.total+'</p>'+
        '<button class="btn gold" id="ov-next" style="margin-top:12px">再玩一次</button>';
    }
    html += '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" id="ov-replay">重玩本关</button><button class="btn ghost" id="ov-home">回到首页</button></div>';
    showPanel(html);
    var nx=$('ov-next'); if(nx) nx.onclick=function(){
      hidePanel();
      if(st.lv < LEVELS.length-1){ st.lv++; st.limit = Math.min(st.limit + nextBonus, LEVEL_TIME + LEVEL_BONUS_MAX); buildBoard(); }
      else { st.lv=0; st.score=0; st.total=0; st.limit=LEVEL_TIME; showHome(); }
    };
    var rp=$('ov-replay'); if(rp) rp.onclick=function(){ hidePanel(); st.score=st.levelStartScore||0; buildBoard(); };
    var hm=$('ov-home'); if(hm) hm.onclick=function(){ hidePanel(); st.score=0; st.total=0; st.lv=0; st.limit=LEVEL_TIME; showHome(); };
    render();
  },520);
}
function timeUp(){
  stopTimer(); sfx.lose();
  var html='<h2>时间到！</h2><div class="big">'+st.score+'</div>'+
    '<div class="kv"><span>本关配对</span><b>'+st.matched+' / '+st.total_pairs+'</b></div>'+
    '<div class="kv"><span>答错次数</span><b>'+st.wrong+'</b></div>'+
    '<p>再试一次，把剩下的词都消掉！</p>'+
    '<button class="btn gold" id="ov-retry" style="margin-top:10px">重玩本关</button>'+
    '<div style="margin-top:8px"><button class="btn ghost" id="ov-home">回到首页</button></div>';
  showPanel(html);
  $('ov-retry').onclick=function(){ hidePanel(); buildBoard(); };
  $('ov-home').onclick=function(){ hidePanel(); st.score=0; st.total=0; st.lv=0; st.limit=LEVEL_TIME; showHome(); };
}

/* ---------- 面板 ---------- */
function showPanel(html){ $('panel').innerHTML=html; $('panel').onclick=null; $('overlay').classList.add('on'); }
function hidePanel(){ $('overlay').classList.remove('on'); }

function showHome(){
  stopTimer();
  st.gen++;
  var btns='';
  LEVELS.forEach(function(L,i){ btns += '<button data-l="'+i+'">第 '+(i+1)+' 关</button>'; });
  var html='<h1>Unit 1 单词消消乐</h1>'+
    '<p>来自《新视野大学英语》Unit 1 词汇表<br>共 '+WORDS.length+' 个词条 · '+LEVELS.length+' 关</p>'+
    '<div class="rule">'+
      '<div><b>① 点英文卡片</b>：听发音，卡片高亮选中</div>'+
      '<div><b>② 点对应中文卡片</b>：配对成功，两个卡片一起消失</div>'+
      '<div><b>③ 计分</b>：配对 +100 分，连击额外加分；答错扣 3 秒</div>'+
      '<div><b>④ 时间</b>：每关 '+LEVEL_TIME+' 秒，答错再扣 3 秒</div>'+
      '<div><b>⑤ 过关</b>：剩余时间全部折算成奖励分</div>'+
    '</div>'+
    '<div class="lvhead" style="text-align:center">选择关卡</div>'+
    '<div class="lvbtn" id="lvpick">'+btns+'</div>'+
    '<button class="btn gold" id="ov-start" style="margin-top:14px">开始游戏</button>';
  showPanel(html);
  var picked = 0;
  var lp=$('lvpick');
  lp.onclick=function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    picked=+b.getAttribute('data-l');
    Array.prototype.forEach.call(lp.children,function(x){x.classList.remove('on');});
    b.classList.add('on');
  };
  $('ov-start').onclick=function(){
    hidePanel();
    st.lv=picked; st.score=0; st.total=0; st.limit=LEVEL_TIME; st.best=0;
    buildBoard();
  };
}

/* ---------- 词表 ---------- */
function showList(){
  var html='<h2>Unit 1 词汇表</h2><p style="font-size:12.5px">点任意一行可朗读该词</p><div class="list">';
  LEVELS.forEach(function(L,i){
    html += '<div class="lvhead">第 '+(i+1)+' 关</div>';
    L.forEach(function(w){
      html += '<div class="item" data-en="'+esc(w.en)+'" data-slug="'+slugify(w.en)+'">'+
        '<span class="e">'+esc(w.en)+'</span>'+
        (w.ipa?'<span class="i">'+esc(w.ipa)+'</span>':'')+
        '<span class="c">'+esc(w.cn)+'</span></div>';
    });
  });
  html += '</div><button class="btn" id="ov-close">关闭</button>';
  showPanel(html);
  $('panel').onclick=function(ev){
    var it=ev.target.closest('.item'); if(!it) return;
    speak(it.getAttribute('data-en'), it.getAttribute('data-slug'));
  };
  $('ov-close').onclick=hidePanel;
}

/* ---------- 按钮 ---------- */
$('btn-help').onclick=function(){
  showPanel('<h2>玩法说明</h2>'+
    '<div class="rule">'+
    '<div><b>目标</b>：把英文卡片和中文意思配成一对</div>'+
    '<div><b>点英文</b>：朗读发音并选中该卡</div>'+
    '<div><b>点中文</b>：配对成功 → 星星特效 + 两张卡消失</div>'+
    '<div><b>答错</b>：卡片抖动，扣 3 秒、扣 20 分，连击清零</div>'+
    '<div><b>得分</b>：每对 +100，连击每级 +20（最高 +100）</div>'+
    '<div><b>过关</b>：剩余每秒折算 10 分奖励，下一关时间更长</div>'+
    '<div><b>时间</b>：每关 '+(typeof LEVEL_TIME!=='undefined'?LEVEL_TIME:120)+' 秒，答错扣 3 秒</div>'+
    '<div><b>重玩</b>：底部“重玩本关”只重置当前关；“从头开始”重置全部</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
    '<button class="btn ghost" id="ov-close">知道了</button>'+
    '<button class="btn" id="ov-list">查看全部词表</button></div>');
  $('ov-close').onclick=hidePanel;
  $('ov-list').onclick=showList;
};
$('btn-full').onclick=function(){
  try{
    var el=document.documentElement;
    var rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(rq){ rq.call(el); return; }
  }catch(e){}
  toast('请用浏览器菜单选择"全屏"');
};
$('btn-replay').onclick=function(){ stopTimer(); buildBoard(); toast('本关已重置'); };
$('btn-restart').onclick=function(){ stopTimer(); st.lv=0; st.score=0; st.total=0; st.limit=LEVEL_TIME; st.best=0; showHome(); };
window.addEventListener('resize',layoutCols);
document.addEventListener('touchmove',function(e){ if(e.touches.length>1) e.preventDefault(); },{passive:false});

/* ---------- 启动 ---------- */
showHome();
render();
</script>
</body>
</html>
