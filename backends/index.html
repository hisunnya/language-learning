<!DOCTYPE html>
<html lang="zh-CN" data-theme="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>总后台 · Back Office · 词境 Lexica</title>
<meta name="description" content="词境 Lexica 的全站后台：一次看全六个模块的成绩、名下学生和访问情况。">
<link rel="stylesheet" href="/shared/module-header.css?v=c2f015ff">
<link rel="stylesheet" href="css/backends.css?v=e856cd9c">
</head>
<body>
<main class="bo-page">
  <header class="portal-topbar">
    <a class="portal-brand" href="/" aria-label="词境 Lexica">
      <span class="portal-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="4.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="10.5" width="7.5" height="10.5" rx="1.6"/></svg></span>
      <span class="portal-brand-copy">
        <strong><span data-module-zh="总后台" data-module-en="Back Office">总后台</span><em>BACK OFFICE</em></strong>
        <small data-module-zh="词境 Lexica 全站管理" data-module-en="Lexica site administration">词境 Lexica 全站管理</small>
      </span>
    </a>
    <nav class="portal-nav portal-nav--compact">
      <a href="/" data-module-zh="返回主页" data-module-en="Website home">返回主页</a>
    </nav>
    <div class="portal-topbar-right" id="portalHeaderControls"></div>
  </header>

  <!-- 登录门：没登录时只显示这一块 -->
  <section class="gate" id="gate" hidden>
    <form class="gate-form" id="gateForm" novalidate>
      <p class="eyebrow" data-module-zh="仅限老师与管理员" data-module-en="STAFF ONLY">仅限老师与管理员</p>
      <h1 data-module-zh="登录总后台" data-module-en="Sign in to the back office">登录总后台</h1>
      <p class="gate-copy" data-module-zh="用你的工号和密码登录。这里会一次列出六个模块的成绩、名下学生和最近记录。" data-module-en="Sign in with your staff number and password. This page lists all six modules in one place.">用你的工号和密码登录。这里会一次列出六个模块的成绩、名下学生和最近记录。</p>
      <label>
        <span data-module-zh="工号 / 学号" data-module-en="Staff or student number">工号 / 学号</span>
        <input id="gateNo" name="student_no" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label>
        <span data-module-zh="密码" data-module-en="Password">密码</span>
        <input id="gatePw" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="gate-submit" id="gateSubmit" type="submit" data-module-zh="登录" data-module-en="Sign in">登录</button>
      <p class="gate-msg" id="gateMsg" role="alert"></p>
    </form>
  </section>

  <!-- 主体：登录后才显示 -->
  <section class="bo-main" id="main" hidden>
    <div class="bo-bar">
      <div>
        <p class="eyebrow" data-module-zh="词境 Lexica · 全站总览" data-module-en="LEXICA · SITE OVERVIEW">词境 Lexica · 全站总览</p>
        <h1 data-module-zh="六个模块，一处看完" data-module-en="All six modules, one place">六个模块，一处看完</h1>
        <p class="bo-bar-copy" id="scopeNote"></p>
      </div>
      <div class="bo-user">
        <span class="bo-user-chip" id="userChip"></span>
        <button class="ghost-button" id="refreshBtn" type="button" data-module-zh="刷新" data-module-en="Refresh">刷新</button>
        <button class="ghost-button" id="logoutBtn" type="button" data-module-zh="退出登录" data-module-en="Sign out">退出登录</button>
      </div>
    </div>

    <div class="bo-grid">
      <div>
        <section class="bo-section">
          <h2 data-module-zh="各模块概况" data-module-en="Modules at a glance">各模块概况</h2>
          <p class="bo-section-note" id="moduleNote"></p>
          <div class="module-grid" id="moduleCards"></div>
        </section>

        <section class="bo-section">
          <h2 data-module-zh="最近的练习记录" data-module-en="Recent practice records">最近的练习记录</h2>
          <div class="filter-row">
            <span class="bo-section-note" data-module-zh="模块" data-module-en="Module">模块</span>
            <select id="subjectFilter"></select>
          </div>
          <div class="table-wrap" id="recordTable"></div>
        </section>
      </div>

      <div>
        <section class="bo-section">
          <h2 data-module-zh="名下学生" data-module-en="Your students">名下学生</h2>
          <p class="bo-section-note" id="studentNote"></p>
          <div class="table-wrap" id="studentTable"></div>
        </section>

        <section class="bo-section">
          <h2 data-module-zh="常用管理页" data-module-en="Management pages">常用管理页</h2>
          <div class="link-list" id="linkList"></div>
        </section>
      </div>
    </div>

    <p class="bo-foot" id="footNote"></p>
  </section>
</main>
<script src="/shared/module-header.js?v=0b00f0ec"></script>
<script src="js/backends.js?v=6c6cd867"></script>
<script src="/shared/site-footer.js?v=9d9c1f36"></script>
</body>
</html>
