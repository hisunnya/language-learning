# 词境整站 —— 家里宿主机 80 端口的入口（局域网）
#
# 网站本身（主页、四个模块、要登录的 /word-puzzle/）全部在学生版容器里，宿主机只把请求原样转给容器的内网入口，
# 所以局域网里看到的和公网（Funnel / 以后的 lexica.cn）完全一样，只有一份内容要维护。
#
#   http://<宿主机>/  →  http://<容器内网入口>/   （__UPSTREAM__，来自 deploy.local.env 的 LEXICA_UPSTREAM）
#
# 由 hub/deploy/install.sh 在设了 LEXICA_UPSTREAM 时生成；没设（开发 VM）时仍用 lingua-grove.conf 的本机布局。

upstream lexica_site {
    server __UPSTREAM__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __LINGUA_SERVER_NAME__;

    # TV 直播列表: 配置独立存放在 tv-*.inc, 变更不影响本文件
    include /etc/nginx/conf.d/tv-*.inc;

    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/lingua-grove.access.log;
    error_log  /var/log/nginx/lingua-grove.error.log;

    location / {
        proxy_pass http://lexica_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
