# 语林 Lingua Grove —— nginx 站点配置
#
# 总主页和两个纯静态项目在 80 端口，词境 Lexica 单独使用 8082：
#
#   :80/        → 总主页（hub/）
#   :80/topics/ → 每日话题（静态）
#   :80/ham/    → 无线电执照（静态）
#   :8082/      → 词境 Lexica（静态文件 + 反代 API）
#
# 安装：
#   sudo mkdir -p /var/www/lingua-grove
#   sudo cp -r ../index.html ../css ../js /var/www/lingua-grove/
#   sudo cp lingua-grove.conf /etc/nginx/sites-available/lingua-grove
#   sudo ln -s /etc/nginx/sites-available/lingua-grove \
#            /etc/nginx/sites-enabled/lingua-grove
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：词境使用根路径资源，不能直接挂在 /lexica/ 子路径下。

upstream lexica_api {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __LINGUA_SERVER_NAME__;

    charset utf-8;
    # ---------- 总主页 ----------
    root /var/www/lingua-grove;
    index index.html;

    access_log /var/log/nginx/lingua-grove.access.log;
    error_log  /var/log/nginx/lingua-grove.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location = / {
        try_files /index.html =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- 每日话题 ----------
    location ^~ /topics/ {
        alias /var/www/topic-app/;
        index index.html;
    }

    # ---------- 无线电执照 ----------
    location ^~ /ham/ {
        alias /var/www/ham-exam/;
        index index.html;
    }
}

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    charset utf-8;
    client_max_body_size 32m;
    root /srv/word-puzzle/web;
    index index.html;

    access_log /var/log/nginx/lexica.access.log;
    error_log  /var/log/nginx/lexica.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass http://lexica_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 数据库文件不应通过 HTTP 暴露。
    location ~* \.(db|db-wal|db-shm|sqlite3?)$ {
        deny all;
        return 404;
    }
}
