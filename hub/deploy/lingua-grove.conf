# 语林 Lingua Grove —— nginx 站点配置
#
# 总主页和三个项目都通过 80 端口的不同路径访问：
#
#   :80/        → 总主页（hub/）
#   :80/word-puzzle/ → 词境 Lexica（静态文件 + 反代 API）
#   :80/topics/ → 每日话题（静态）
#   :80/ham/    → 无线电执照（静态）
#   :80/chemistry/ → 化学探秘（静态）
#
# 安装：
#   sudo install -d /etc/nginx/conf.d
#   sudo cp lingua-grove.conf /etc/nginx/conf.d/lingua-grove.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 词境前端通过 wp-base 元标签为 API、导航和静态资源补齐子路径前缀。

upstream lexica_api {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __LINGUA_SERVER_NAME__;

    charset utf-8;
    client_max_body_size 32m;
    # ---------- 总主页 ----------
    root /var/www/lingua-grove;
    index index.html;

    access_log /var/log/nginx/lingua-grove.access.log;
    error_log  /var/log/nginx/lingua-grove.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location = / {
        try_files /index.html =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /shared/ {
        alias /var/www/lingua-grove/shared/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- 每日话题 ----------
    location = /topics {
        return 301 /topics/;
    }

    location ^~ /topics/ {
        alias /var/www/topic-app/;
        index index.html;
    }

    location = /word-puzzle {
        return 301 /word-puzzle/;
    }

    location ^~ /word-puzzle/api/ {
        proxy_pass http://lexica_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /word-puzzle/ {
        alias /srv/word-puzzle/web/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location /offline/ {
        alias /srv/word-puzzle/var/offline/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # ---------- 无线电执照 ----------
    location = /ham {
        return 301 /ham/;
    }

    location ^~ /ham/ {
        alias /var/www/ham-exam/;
        index index.html;
    }

    # ---------- 化学探秘 ----------
    location = /chemistry {
        return 301 /chemistry/;
    }

    location ^~ /chemistry/ {
        alias /var/www/chemistry/;
        index index.html;
    }
}
